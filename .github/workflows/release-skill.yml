name: Release skill package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read and verify version
        run: |
          VERSION="$(tr -d ' \r\n' < sgcc-writer/VERSION)"
          if [ -z "$VERSION" ]; then
            echo "VERSION file is empty"
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME#v}"
            if [ "$TAG" != "$VERSION" ]; then
              echo "Tag $TAG does not match VERSION $VERSION"
              exit 1
            fi
          fi
          if ! grep -q "version-${VERSION}-" README.md; then
            echo "README badge does not match VERSION $VERSION"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build skill-only zip
        run: |
          cd sgcc-writer
          zip -r "../sgcc-writer-${VERSION}.zip" .
          cd ..
          ls -lh "sgcc-writer-${VERSION}.zip"

      - name: Publish release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: sgcc-writer-*.zip
          generate_release_notes: true
